name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Buster AI OS
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm Buster.spec

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Buster\Buster.exe")) {
            throw "Build failed: dist\Buster\Buster.exe was not created."
          }

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = "Buster-AI-OS-${{ github.ref_name }}-Windows.zip"
          Compress-Archive `
            -Path "dist\Buster\*" `
            -DestinationPath $archive `
            -Force

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Buster AI OS ${{ github.ref_name }}
          generate_release_notes: true
          files: Buster-AI-OS-${{ github.ref_name }}-Windows.zip
